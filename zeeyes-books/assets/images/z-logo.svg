<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Korean Tech Sandalwood Gradient - Upper Blade -->
    <linearGradient id="kz-sq-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1D4" />
      <stop offset="50%" stop-color="#EAA685" />
      <stop offset="100%" stop-color="#C17A56" />
    </linearGradient>

    <!-- Korean Tech Sandalwood Gradient - Lower Blade -->
    <linearGradient id="kz-sq-bot" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8F4628" />
      <stop offset="50%" stop-color="#AA6543" />
      <stop offset="100%" stop-color="#C17A56" />
    </linearGradient>

    <!-- Deep Obsidian Korean Tech Squircle -->
    <linearGradient id="kz-sq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162238" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <!-- Core Aperture Glow -->
    <radialGradient id="kz-sq-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FCE1D4" />
      <stop offset="100%" stop-color="#C17A56" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Modern Korean Squircle Badge -->
  <rect width="64" height="64" rx="18" fill="url(#kz-sq-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#C17A56" stroke-opacity="0.45" stroke-width="1.8" />

  <!-- Scale & Centered 64px Version -->
  <g transform="translate(32, 32) scale(1.4) translate(-20, -20)">
    <!-- Upper Dynamic Wing of 'Z' -->
    <path d="M 11.5 13.5 L 28.5 13.5 L 18.5 23.5" fill="none" stroke="url(#kz-sq-top)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lower Dynamic Wing of 'Z' -->
    <path d="M 28.5 26.5 L 11.5 26.5 L 21.5 16.5" fill="none" stroke="url(#kz-sq-bot)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Precision Aperture Glow -->
    <circle cx="20" cy="20" r="4.5" fill="url(#kz-sq-glow)" opacity="0.7" />
    <circle cx="20" cy="20" r="1.8" fill="#FFFFFF" />
  </g>
</svg>
